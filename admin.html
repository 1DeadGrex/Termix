<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMIX // ADMIN CONSOLE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0907'/><text x='2' y='12' font-family='monospace' font-size='11' fill='%23ff5238'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--panel:#141008;--panel2:#1d1609;--ink:#0f0c06;--line:#3a2f14;--line2:#5c4918;--deep:#8a6a10;--amber:#ffb000;--amber2:#ffd75e;--txt:#efe6c8;--mut:#a8976a;--dim:#6f6140;--red:#ff5238;--green:#57e389}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.55;min-height:100vh}
body.noscroll{overflow:hidden}
::selection{background:var(--amber);color:#140d00}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--amber);text-decoration:none}
.px{font-family:'Press Start 2P',monospace}
.vt{font-family:'VT323',monospace}
.fx.scan{position:fixed;inset:0;pointer-events:none;z-index:1100;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.fx.vig{position:fixed;inset:0;pointer-events:none;z-index:1100;background:radial-gradient(ellipse 120% 100% at 50% 45%,transparent 60%,rgba(0,0,0,.45))}
@keyframes blink{50%{opacity:0}}
.cursor{display:inline-block;width:.62em;height:1em;background:var(--red);vertical-align:-.12em;margin-left:6px;animation:blink 1s steps(1) infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:1px;color:var(--amber);background:var(--panel2);border:1px solid var(--line2);padding:12px 16px;box-shadow:4px 4px 0 #000;text-transform:uppercase;user-select:none;text-align:center}
.btn:hover:not(:disabled){color:var(--amber2);border-color:var(--amber)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);color:#140d00;border-color:var(--amber)}
.btn.primary:hover:not(:disabled){background:var(--amber2);border-color:var(--amber2);color:#140d00}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ok{color:var(--green);border-color:var(--green)}
.btn.sm{padding:8px 10px;font-size:8px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:6px 6px 0 #000}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line);padding:12px 16px}
.phead h2{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--amber);letter-spacing:1px}
.phead-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--mut);border:1px solid var(--line);background:var(--ink);padding:4px 8px;white-space:nowrap}
.tag.off{color:var(--red);border-color:var(--red)}
.tag.on{color:var(--green);border-color:var(--green)}
.pbody{padding:16px}
.badge{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:1px;padding:5px 8px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.badge.live{color:var(--red);border-color:var(--red);animation:blink 1.2s steps(1) infinite}
.badge.open{color:var(--green);border-color:var(--green)}
.badge.done{color:var(--dim);border-color:var(--line)}
.badge.warn{color:var(--amber2);border-color:var(--amber)}
.modetag{font-family:'Press Start 2P',monospace;font-size:8px;border:1px solid var(--amber);color:var(--amber);padding:5px 7px;letter-spacing:1px}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line2);background:var(--ink);color:var(--mut);font-family:'VT323',monospace;font-size:21px}
.empty b{display:block;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--amber);margin-bottom:14px}
.fl{display:block;font-weight:600;font-size:10px;letter-spacing:1.5px;color:var(--mut);margin:16px 0 6px;text-transform:uppercase}
.inp{width:100%;background:var(--ink);border:1px solid var(--line2);color:var(--amber2);font-family:'VT323',monospace;font-size:20px;padding:8px 10px}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:3px 3px 0 #000}
.inp::placeholder{color:var(--dim)}
select.inp option{background:var(--ink);color:var(--amber2)}
textarea.inp{min-height:72px;resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:13px}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.err-msg{display:none;color:var(--red);font-size:12px;font-weight:600;margin-top:10px;line-height:1.5;word-break:break-word}
.err-msg.show{display:block}
#toasts{position:fixed;right:16px;bottom:16px;z-index:1300;display:flex;flex-direction:column;gap:10px;max-width:min(440px,92vw)}
.toast{background:var(--panel2);border:1px solid var(--amber);box-shadow:4px 4px 0 #000;padding:11px 14px;font-size:12px;font-weight:600;color:var(--amber2);word-break:break-word}
.toast.err{border-color:var(--red);color:#ffb4a5}
.toast.ok{border-color:var(--green);color:var(--green)}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate{width:min(480px,100%)}
.gate-head{border-bottom:1px solid var(--red)}
.gate-head h2{color:var(--red) !important}
.gate-sub{font-family:'VT323',monospace;font-size:19px;color:var(--mut);letter-spacing:1px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.gate .btn{width:100%;margin-top:20px}
#abar{position:sticky;top:0;z-index:950;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.abrand{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--amber);text-shadow:2px 2px 0 #000}
.abrand .red{color:var(--red)}
.abar-sp{flex:1}
.awrap{max-width:1280px;margin:0 auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:22px}
#ahud{position:sticky;bottom:0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:8px 18px;background:var(--panel);border-top:1px solid var(--line);font-size:10px;font-weight:600;letter-spacing:1px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.acard{padding:14px;display:flex;flex-direction:column}
.ac-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.aname{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.75;color:var(--amber2);margin:13px 0 8px;word-wrap:break-word}
.adesc{font-size:12.5px;color:var(--mut);line-height:1.6;min-height:40px}
.spec{border:1px solid var(--line);background:var(--ink);margin:12px 0}
.srow{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-bottom:1px dashed var(--line);font-size:10px}
.srow:last-child{border-bottom:none}
.srow span{color:var(--dim);letter-spacing:1px}
.srow b{color:var(--txt);font-weight:600;text-align:right;word-break:break-word}
.aprize{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 12px;gap:10px}
.aprize .big{font-family:'VT323',monospace;color:var(--amber);line-height:1.1;text-shadow:2px 2px 0 #000;text-align:right;word-break:break-word}
.abtns{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtns .wide{grid-column:1/-1}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);text-align:left;padding:10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--panel2)}
td.vt{font-size:19px}
.ractions{display:flex;gap:6px}
.rid{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mwrap{position:fixed;inset:0;z-index:1050;display:none;align-items:center;justify-content:center;background:rgba(4,3,1,.84);padding:20px}
.mwrap.open{display:flex}
.modal{width:min(620px,100%);max-height:92vh;overflow-y:auto;border-color:var(--line2)}
.mrow{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:640px){.mwrap{padding:0}.modal{width:100%;height:100%;max-height:100vh;border-left:none;border-right:none;box-shadow:none}.f2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="fx scan" aria-hidden="true"></div>
<div class="fx vig" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>

<div id="gate">
  <div class="gate panel">
    <div class="phead gate-head"><h2>AUTHENTICATION</h2><span class="tag off">RESTRICTED</span></div>
    <div class="pbody">
      <p class="gate-sub">TERMINAL LOCKED — ADMIN CLEARANCE REQUIRED<span class="cursor"></span></p>
      <form id="gateForm" novalidate>
        <label class="fl" for="gKey">ADMIN KEY</label>
        <input id="gKey" class="inp" type="password" placeholder="paste admin key" autocomplete="off">
        <div id="gErr" class="err-msg" role="alert"></div>
        <button type="submit" id="gGo" class="btn danger">UNLOCK CONSOLE ►</button>
        <div class="hint">Key is stored locally and sent as a query parameter. The console stays locked until the server confirms.</div>
      </form>
    </div>
  </div>
</div>

<div id="dash" hidden>
  <header id="abar">
    <div class="abrand">TERMIX <span class="red">// ADMIN CONSOLE</span></div>
    <div class="abar-sp"></div>
    <a class="btn sm ghost" href="index.html">VIEW SITE ↗</a>
    <button id="aRefresh" class="btn sm">⟳ REFRESH</button>
    <button id="aLogout" class="btn sm danger">LOGOUT</button>
  </header>

  <main class="awrap">
    <section class="panel">
      <div class="phead">
        <h2>
